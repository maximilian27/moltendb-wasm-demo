<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoltenDB WASM Explorer Examples</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        padding: 3rem;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h1 {
        background: linear-gradient(90deg, #e94560, #f5a623);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2rem;
      }
      .links {
        display: flex;
        gap: 2rem;
        justify-content: center;
      }
      a {
        text-decoration: none;
        color: #fff;
        background: #e94560;
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        font-weight: bold;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      a:hover {
        background: #ff5e78;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>MoltenDB WASM Explorer</h1>
      <div class="links">
        <a href="/src/raw-json-explorer.html">Raw JSON Explorer</a>
        <a href="/src/query-builder-explorer.html">Query Builder Explorer</a>
      </div>
    </div>
  </body>
</html>
